name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "data/**"
      - "README.md"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test the report on a failed-pipeline payload (no network, no email)
        run: |
          python - <<'PY'
          import send_report
          html = send_report.render_html(
              {"status": "FAILED", "fetch_date": "1970-01-01", "records_fetched": 0,
               "records_stored": 0, "quality_metrics": {}, "warnings": [], "error_message": "smoke"},
              None, {})
          assert "FAILED" in html
          print("report template OK")
          PY
